version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: raceproof-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: raceproof
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d raceproof']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: raceproof-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/raceproof?schema=public'
      JWT_SECRET: 'raceproof_docker_secret_hack4hack_2026_super_key'
      JWT_EXPIRES_IN: '7d'
      FRONTEND_URL: 'http://localhost'
      COOKIE_SECURE: 'false'
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 1000
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: raceproof-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pgdata:
